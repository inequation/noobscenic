[package]
name = "noobscenic"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
# All on by default: a plain build is the full server (doc/PLAN.md §21).
default = ["debug-trace", "debug-raw", "console", "cli-ux", "history"]
# Debug surfaces: the JSONL timeline and the verbatim raw byte sink.
debug-trace = []
debug-raw = []
# The full `events`, `clean_paths` and terminal `commands` history, plus the `events`
# console/CLI verb. Off, `events` keeps only the newest status and bind/unbind row per
# device, `clean_paths` only the newest path, terminal command rows are dropped
# (acked silently, expired/failed with a warning) and `sessions` keeps one row per
# device — everything day-to-day operation reads.
history = []
# An advanced control surface, not a debug feature: the stdin console and the
# one-shot CLI verbs.
console = []
# Colour and typo suggestions for the interactive CLI. The router build
# (doc/ROUTER_BUILD.md) leaves it out because its flag set is
# `--no-default-features --features console`; help, usage and error context stay
# in either way.
cli-ux = ["clap/color", "clap/suggestions"]

[dependencies]
aes = "0.9.3"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.6", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
lz4_flex = "0.14.0"
md-5 = "0.11.0"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util", "io-std"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tower = { version = "0.5.3", default-features = false, features = ["util"] }

# The router build (doc/ROUTER_BUILD.md): a FreshTomato K26ARM kernel has no
# VFP, and libunwind's ARM register save/restore stubs use it, so a panic must
# not unwind. Size-first codegen: the workload is I/O-bound, and fat LTO with
# one codegen unit and -Oz take the ARM binary from ~6 MB to ~3.5 MB.
[profile.router]
inherits = "release"
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = "z"
