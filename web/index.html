<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noobscenic</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; height: 100dvh;
         background: #16181d; color: #e8e8ea;
         font: 15px/1.35 system-ui, sans-serif; }
  header, footer { display: flex; align-items: center; gap: 8px;
                   padding: 8px 10px; background: #1f2229; }
  header { flex-wrap: wrap; }
  footer { justify-content: center; }
  #status { flex: 1 1 100%; min-width: 0; font-size: 13px; color: #9aa0aa;
            white-space: nowrap; overflow-x: auto; }
  main { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none;
           cursor: grab; user-select: none; -webkit-user-select: none; }
  canvas.panning { cursor: grabbing; }
  select, button { font: inherit; padding: 8px 10px; border-radius: 6px;
                   border: 1px solid #3a3f48; background: #262a32; color: inherit; }
  select { max-width: 65vw; }
  button { min-width: 88px; }
  button.big { min-width: 64px; font-size: 22px; line-height: 1; padding: 10px 12px; }
  button:disabled { opacity: 0.45; }
  #menu-toggle { min-width: 0; font-size: 20px; line-height: 1; padding: 6px 10px; }
  #menu { position: fixed; left: 0; bottom: 0; width: 15rem; z-index: 2;
          background: #1f2229; border-right: 1px solid #2c313a; overflow-y: auto;
          transform: translateX(-100%); transition: transform 150ms ease; }
  #menu.open { transform: none; }
  #menu .drawer { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
  #sent { min-width: 0; font-size: 13px; color: #9aa0aa;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<header>
  <button id="menu-toggle" title="More…">☰</button>
  <label for="robot">Robot</label>
  <select id="robot"></select>
  <span id="status">loading…</span>
</header>
<aside id="menu">
  <div class="drawer">
    <select id="command"></select>
    <button id="send">Send</button>
    <span id="sent"></span>
  </div>
</aside>
<main><canvas id="map" width="1" height="1"></canvas></main>
<footer>
  <button id="charge" class="big" title="Charge">⚡</button>
  <button id="primary" class="big" title="Unknown state" disabled>▶️</button>
  <button id="zones" class="big" title="Zone cleaning" disabled>🗺️</button>
</footer>
<script>
"use strict";
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
const header = document.querySelector("header");
const robotSelect = document.getElementById("robot");
const commandSelect = document.getElementById("command");
const statusLine = document.getElementById("status");
const sentLine = document.getElementById("sent");
const menu = document.getElementById("menu");
const menuToggle = document.getElementById("menu-toggle");
const chargeButton = document.getElementById("charge");
const primaryButton = document.getElementById("primary");

let robot = null;   // the {id} the API is addressed by
let mapRev = null;  // "id:received_ms" of the drawn map
let pathRev = null; // "id:span" of the drawn path
let base = null;    // the fetched map frame
let points = [];    // the fetched path, tags already stripped
let grid = null;    // offscreen canvas with the map at one pixel per cell
let view = null;    // {scale, x, y}: map origin in CSS pixels, and pixels per cell
let autoFit = true; // until the first pan or zoom, keep the map fitted
const pointers = new Map();
let pinch = null;

async function json(url, options) {
  const response = await fetch(url, options);
  if (!response.ok) throw new Error(url + ": " + response.status);
  return response.json();
}

function api(suffix, options) {
  return json("/api/robot/" + encodeURIComponent(robot) + suffix, options);
}

async function init() {
  const robots = await json("/api/robots");
  robotSelect.innerHTML = "";
  for (const entry of robots.robots) {
    const option = document.createElement("option");
    option.value = entry.id;
    option.textContent = entry.id === entry.sn ? entry.sn : entry.id + " (" + entry.sn + ")";
    robotSelect.append(option);
  }
  const wanted = new URLSearchParams(location.search).get("id");
  if (wanted && robots.robots.some((entry) => entry.id === wanted)) {
    robotSelect.value = wanted;
  }
  robotSelect.onchange = () => {
    location.search = "?id=" + encodeURIComponent(robotSelect.value);
  };

  const catalog = await json("/api/commands");
  commandSelect.innerHTML = "";
  for (const name of catalog.commands) {
    const option = document.createElement("option");
    option.value = option.textContent = name;
    commandSelect.append(option);
  }
  document.getElementById("send").onclick = send;
  chargeButton.onclick = () => sendCommand("findCharge");
  primaryButton.onclick = () => {
    if (primaryButton.dataset.command) sendCommand(primaryButton.dataset.command);
  };
  menuToggle.onclick = () => {
    const open = menu.classList.toggle("open");
    menuToggle.textContent = open ? "⦀" : "☰";
    if (open) menu.style.top = header.offsetHeight + "px";
  };

  if (!robotSelect.value) {
    statusLine.textContent = "no robots seen yet";
    return;
  }
  robot = robotSelect.value;
  resize();
  tick();
  setInterval(tick, 1500);
}

async function tick() {
  // Hiding the tab pauses the heartbeat, and with it the path poller.
  if (!robot || document.hidden) return;
  try {
    const summary = await api("/summary");
    statusLine.textContent = describe(summary);
    updateButtons(summary);
    const map = summary.map;
    if (map && map.map_id != null) {
      const rev = map.map_id + ":" + map.received_ms;
      if (rev !== mapRev) {
        base = await api("/map");
        mapRev = rev;
        setMap(base);
      }
    }
    const path = summary.path;
    const rev = path ? path.path_id + ":" + path.span : "none";
    if (rev !== pathRev) {
      points = path ? (await api("/path")).points : [];
      pathRev = rev;
      draw();
    }
  } catch (error) {
    statusLine.textContent = "error: " + error.message;
  }
}

function describe(summary) {
  const bits = [summary.online ? "online" : "offline"];
  const status = summary.status || {};
  if (status.mode) bits.push(status.mode);
  if (status.elec != null) bits.push("battery " + status.elec + "%");
  if (status.cleanTime != null) bits.push("clean " + status.cleanTime + "s");
  if (status.cleanArea != null) bits.push("area " + status.cleanArea + "m²");
  bits.push(summary.sn);
  return bits.join("  ·  ");
}

async function send() {
  await sendCommand(commandSelect.value);
}

async function sendCommand(name) {
  try {
    const body = new URLSearchParams({ name });
    const reply = await api("/command", { method: "POST", body });
    const note = "queued #" + reply.queued + " " + reply.name;
    sentLine.textContent = note;
    statusLine.textContent = note; // the next poll overwrites it
  } catch (error) {
    sentLine.textContent = "send failed: " + error.message;
  }
}

// Bottom bar: the stateful button follows the robot's `mode` (FUNC_STATUS §3.1).
// Docked (charge/fullcharge) starts a clean, `sweep` pauses, and the stopped states
// resume; anything else (returning, manual, fault) leaves it disabled with the raw
// mode as its tooltip.
const PRIMARY_STATES = {
  charge: ["▶️", "Smart cleaning", "smartClean"],
  fullcharge: ["▶️", "Smart cleaning", "smartClean"],
  sweep: ["⏸️", "Pause", "pause"],
  pause: ["⏯️", "Continue", "continue"],
  idle: ["⏯️", "Continue", "continue"],
  dormant: ["⏯️", "Continue", "continue"],
  fault: ["⏯️", "Continue", "continue"],
};

function updateButtons(summary) {
  const mode = (summary.status || {}).mode || "";
  chargeButton.disabled = !(summary.online && mode);
  const state = PRIMARY_STATES[mode];
  if (!summary.online || !state) {
    primaryButton.disabled = true;
    primaryButton.textContent = "▶️";
    primaryButton.title = mode || "Unknown state";
    delete primaryButton.dataset.command;
    return;
  }
  primaryButton.disabled = false;
  primaryButton.textContent = state[0];
  primaryButton.title = state[1];
  primaryButton.dataset.command = state[2];
}

function draw() {
  if (!base || !grid || !view) return;
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(
    dpr * view.scale, 0, 0, dpr * view.scale, dpr * view.x, dpr * view.y,
  );
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(grid, 0, 0);

  if (points.length > 1) {
    ctx.strokeStyle = "rgb(30,90,220)";
    ctx.lineWidth = 1.5 / view.scale;
    ctx.lineJoin = "round";
    ctx.beginPath();
    points.forEach(([x, y], index) => {
      const [px, py] = toPixel(x / 1000, y / 1000);
      if (index) ctx.lineTo(px, py);
      else ctx.moveTo(px, py);
    });
    ctx.stroke();
  }
  dot(points[0], "rgb(40,200,60)");
  dot(points[points.length - 1], "rgb(250,140,20)");
  if (base.dock_x != null && base.dock_y != null) {
    diamond(toPixel(base.dock_x / 1000, base.dock_y / 1000));
  }
}

// The same frame mapping tools/map2png.py validated: cell centres sit half a
// cell inside the wire origin, and the rows are flipped for +y up.
function toPixel(x, y) {
  const resolution = base.resolution || 0.05;
  const col = (x - (base.x_min || 0) - 0.05) / resolution;
  let row = (y - (base.y_min || 0) - 0.05) / resolution;
  row = base.height - 1 - row;
  return [col + 0.5, row + 0.5];
}

function dot([x, y], colour) {
  if (x == null) return;
  ctx.fillStyle = colour;
  ctx.beginPath();
  ctx.arc(x, y, 3 / view.scale, 0, 7);
  ctx.fill();
}

function diamond([x, y]) {
  const radius = 4 / view.scale;
  ctx.fillStyle = "rgb(230,40,40)";
  ctx.beginPath();
  ctx.moveTo(x, y - radius);
  ctx.lineTo(x + radius, y);
  ctx.lineTo(x, y + radius);
  ctx.lineTo(x - radius, y);
  ctx.fill();
}

function cellColour(cell) {
  if (cell === 0x00) return [28, 28, 36];
  if (cell === 0x7f) return [158, 162, 172];
  if (cell === 0xff) return [250, 250, 246];
  return hsv((cell * 0.61803398875) % 1, 0.42, 0.96);
}

function hsv(h, s, v) {
  const i = Math.floor(h * 6);
  const f = h * 6 - i;
  const p = v * (1 - s);
  const q = v * (1 - f * s);
  const t = v * (1 - (1 - f) * s);
  const [r, g, b] = [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
  return [(r * 255) | 0, (g * 255) | 0, (b * 255) | 0];
}

function base64Bytes(text) {
  const binary = atob(text);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

// Render the wire grid into an offscreen canvas once, at one pixel per cell.
function setMap(map) {
  const width = map.width;
  const height = map.height;
  const cells = base64Bytes(map.grid_b64);
  grid = document.createElement("canvas");
  grid.width = width;
  grid.height = height;
  const target = grid.getContext("2d");
  const image = target.createImageData(width, height);
  for (let row = 0; row < height; row++) {
    // Wire row 0 is the smallest y; the page reads like a floor plan (+y up).
    const src = (height - 1 - row) * width;
    const dst = row * width * 4;
    for (let col = 0; col < width; col++) {
      const [r, g, b] = cellColour(cells[src + col]);
      const at = dst + col * 4;
      image.data[at] = r;
      image.data[at + 1] = g;
      image.data[at + 2] = b;
      image.data[at + 3] = 255;
    }
  }
  target.putImageData(image, 0, 0);
  if (autoFit || !view) fit();
  else draw();
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (!width || !height) return;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  if (!grid) return;
  if (autoFit) fit();
  else draw();
}

// The largest map that fits the client area whole, aspect ratio intact.
function fitScale() {
  return Math.min(canvas.clientWidth / grid.width, canvas.clientHeight / grid.height);
}

function fit() {
  const scale = fitScale();
  view = {
    scale,
    x: (canvas.clientWidth - grid.width * scale) / 2,
    y: (canvas.clientHeight - grid.height * scale) / 2,
  };
  autoFit = true;
  draw();
}

// Zoom about a point in canvas coordinates, so the map stays put under the cursor.
function zoomAt(x, y, factor) {
  if (!view) return;
  const min = fitScale();
  const next = Math.min(Math.max(view.scale * factor, min), min * 20);
  // Zoomed all the way out: snap back to the fitted, centred view, so the
  // minimum zoom can never leave the map off in a corner of empty space.
  if (next <= min) {
    fit();
    return;
  }
  view.x = x - (x - view.x) * (next / view.scale);
  view.y = y - (y - view.y) * (next / view.scale);
  view.scale = next;
  autoFit = false;
  draw();
}

function pointerPair() {
  return [...pointers.values()].slice(0, 2);
}

function startPinch() {
  const [a, b] = pointerPair();
  const rect = canvas.getBoundingClientRect();
  pinch = {
    distance: Math.hypot(a.x - b.x, a.y - b.y),
    scale: view.scale,
    x: view.x,
    y: view.y,
    cx: (a.x + b.x) / 2 - rect.left,
    cy: (a.y + b.y) / 2 - rect.top,
  };
}

function pinchMove() {
  const [a, b] = pointerPair();
  if (!pinch || !pinch.distance) return;
  const distance = Math.hypot(a.x - b.x, a.y - b.y);
  const min = fitScale();
  const next = Math.min(Math.max(pinch.scale * (distance / pinch.distance), min), min * 20);
  if (next <= min) {
    fit();
    return;
  }
  view.scale = next;
  view.x = pinch.cx - (pinch.cx - pinch.x) * (next / pinch.scale);
  view.y = pinch.cy - (pinch.cy - pinch.y) * (next / pinch.scale);
  autoFit = false;
  draw();
}

canvas.addEventListener("pointerdown", (event) => {
  if (event.pointerType === "mouse" && event.button !== 0) return;
  canvas.setPointerCapture(event.pointerId);
  pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  canvas.classList.add("panning");
  if (pointers.size === 2) startPinch();
});

canvas.addEventListener("pointermove", (event) => {
  const point = pointers.get(event.pointerId);
  if (!point || !view) return;
  if (pointers.size === 1) {
    view.x += event.clientX - point.x;
    view.y += event.clientY - point.y;
    point.x = event.clientX;
    point.y = event.clientY;
    autoFit = false;
    draw();
  } else {
    point.x = event.clientX;
    point.y = event.clientY;
    if (pointers.size === 2) pinchMove();
  }
});

function endPointer(event) {
  pointers.delete(event.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) canvas.classList.remove("panning");
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);

canvas.addEventListener(
  "wheel",
  (event) => {
    event.preventDefault();
    const rect = canvas.getBoundingClientRect();
    zoomAt(
      event.clientX - rect.left,
      event.clientY - rect.top,
      Math.exp(-event.deltaY * 0.002),
    );
  },
  { passive: false },
);

// Double-click / double-tap: back to the fitted view.
canvas.addEventListener("dblclick", () => { if (grid) fit(); });
window.addEventListener("resize", () => {
  if (menu.classList.contains("open")) menu.style.top = header.offsetHeight + "px";
  resize();
});

init().catch((error) => { statusLine.textContent = "error: " + error.message; });
</script>
</body>
</html>
