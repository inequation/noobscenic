<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noobscenic</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; height: 100dvh;
         background: #16181d; color: #e8e8ea;
         font: 15px/1.35 system-ui, sans-serif; }
  header, footer { display: flex; align-items: center; gap: 8px;
                   padding: 8px 10px; background: #1f2229; }
  header { flex-wrap: wrap; }
  footer { justify-content: center; }
  #status { flex: 1 1 100%; min-width: 0; font-size: 13px; color: #9aa0aa;
            white-space: nowrap; overflow-x: auto; }
  main { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none;
           cursor: grab; user-select: none; -webkit-user-select: none; }
  canvas.panning { cursor: grabbing; }
  select, button { font: inherit; padding: 8px 10px; border-radius: 6px;
                   border: 1px solid #3a3f48; background: #262a32; color: inherit; }
  [hidden] { display: none !important; }
  footer .bar { display: flex; justify-content: center; gap: 8px; }
  select { max-width: 65vw; }
  button { min-width: 88px; }
  button.big { min-width: 64px; font-size: 22px; line-height: 1; padding: 10px 12px; }
  button:disabled { opacity: 0.45; }
  #menu-toggle { min-width: 0; font-size: 20px; line-height: 1; padding: 6px 10px; }
  #menu { position: fixed; left: 0; bottom: 0; width: 15rem; z-index: 2;
          background: #1f2229; border-right: 1px solid #2c313a; overflow-y: auto;
          transform: translateX(-100%); transition: transform 150ms ease; }
  #menu.open { transform: none; }
  #menu .drawer { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tools button { min-width: 0; font-size: 22px; line-height: 1; padding: 10px; }
  #remote { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
            background: #1f2229; border-top: 1px solid #2c313a; padding: 12px 10px;
            transform: translateY(100%); transition: transform 150ms ease; }
  #remote.open { transform: none; }
  #remote .pad { display: grid; grid-template-columns: repeat(3, 1fr);
                 grid-template-rows: repeat(2, 60px); gap: 8px;
                 max-width: 20rem; margin: 0 auto; }
  #remote .pad button { min-width: 0; font-size: 24px; line-height: 1;
                        padding: 0; touch-action: none; }
  #rc-forward { grid-area: 1 / 2 / 2 / 3; }
  #rc-back    { grid-area: 2 / 2 / 3 / 3; }
  #rc-right   { grid-area: 1 / 1 / 3 / 2; }
  #rc-left    { grid-area: 1 / 3 / 3 / 4; }
  #remote-close { position: absolute; top: 6px; right: 8px; min-width: 0;
                  font-size: 14px; padding: 4px 8px; }
  #zone-types { display: flex; align-items: center; gap: 8px; padding: 6px 10px;
                background: #1f2229; border-bottom: 1px solid #2c313a; }
  #zone-hint { min-width: 0; font-size: 12px; color: #9aa0aa; overflow: hidden;
               white-space: nowrap; text-overflow: ellipsis; }
  #settings { position: fixed; inset: 0; z-index: 6; display: flex;
              flex-direction: column; padding: 14px; background: #16181d; }
  #settings h2 { margin: 0 0 14px; font-size: 18px; }
  #settings label { font-size: 13px; color: #9aa0aa; }
  #settings input { font: inherit; padding: 10px; border-radius: 6px;
                    border: 1px solid #3a3f48; background: #262a32; color: inherit; }
  #settings .actions { margin-top: auto; display: flex; justify-content: flex-end;
                       gap: 8px; }
  #sent { min-width: 0; font-size: 13px; color: #9aa0aa;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<header>
  <button id="menu-toggle" title="More…">☰</button>
  <label for="robot">Robot</label>
  <select id="robot"></select>
  <span id="status">loading…</span>
</header>
<aside id="menu">
  <div class="drawer">
    <div class="tools">
      <button id="remote-open" title="Remote control">🕹️</button>
      <button id="settings-open" title="Settings">⚙️</button>
    </div>
    <select id="command"></select>
    <button id="send">Send</button>
    <span id="sent"></span>
  </div>
</aside>
<section id="remote">
  <button id="remote-close" title="Close">❌</button>
  <div class="pad">
    <button id="rc-forward" title="Forward">⬆️</button>
    <button id="rc-back" title="Backward">⬇️</button>
    <button id="rc-right" title="Rotate right">↪️</button>
    <button id="rc-left" title="Rotate left">↩️</button>
  </div>
</section>
<section id="settings" hidden>
  <h2>Settings</h2>
  <label for="settings-label">Label</label>
  <input id="settings-label" maxlength="64" autocomplete="off" spellcheck="false">
  <div class="actions">
    <button id="settings-cancel" type="button">Cancel</button>
    <button id="settings-save" type="button">Save</button>
  </div>
</section>
<div id="zone-types" hidden>
  <select id="zone-type" title="Zone type">
    <option value="noGo">No-go</option>
    <option value="noSweep">No-sweep</option>
    <option value="noMop">No-mop</option>
    <option value="clean">Clean zone</option>
    <option value="deep">Deep clean</option>
  </select>
  <span id="zone-hint">drag to draw · tap to select · right-drag or two fingers to pan</span>
</div>
<main><canvas id="map" width="1" height="1"></canvas></main>
<footer>
  <div id="bar-main" class="bar">
    <button id="charge" class="big" title="Charge">⚡</button>
    <button id="primary" class="big" title="Unknown state" disabled>▶️</button>
    <button id="zones" class="big" title="Zone cleaning">🗺️</button>
  </div>
  <div id="bar-zones" class="bar" hidden>
    <button id="zone-exit" class="big" title="Leave zones">❌</button>
    <button id="zone-play" class="big" title="Clean selected">▶️</button>
    <button id="zone-edit" class="big" title="Edit zones">✏️</button>
  </div>
  <div id="bar-edit" class="bar" hidden>
    <button id="edit-cancel" class="big" title="Cancel editing">❌</button>
    <button id="edit-undo" class="big" title="Undo">↶️</button>
    <button id="edit-delete" class="big" title="Delete the selected zone">🗑️</button>
    <button id="edit-save" class="big" title="Save zones">💾</button>
  </div>
</footer>
<script>
"use strict";
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
const header = document.querySelector("header");
const robotSelect = document.getElementById("robot");
const commandSelect = document.getElementById("command");
const statusLine = document.getElementById("status");
const sentLine = document.getElementById("sent");
const menu = document.getElementById("menu");
const menuToggle = document.getElementById("menu-toggle");
const chargeButton = document.getElementById("charge");
const primaryButton = document.getElementById("primary");
const remoteSheet = document.getElementById("remote");
const settingsPane = document.getElementById("settings");
const settingsLabel = document.getElementById("settings-label");

let robot = null;   // the {id} the API is addressed by
let robotEntries = []; // the dropdown's data, latest from /api/robots
let mapRev = null;  // "id:received_ms" of the drawn map
let pathRev = null; // "id:span" of the drawn path
let base = null;    // the fetched map frame
let points = [];    // the fetched path, tags already stripped
let grid = null;    // offscreen canvas with the map at one pixel per cell
let view = null;    // {scale, x, y}: map origin in CSS pixels, and pixels per cell
let autoFit = true; // until the first pan or zoom, keep the map fitted
const pointers = new Map();
let pinch = null;

// Remote control: realtime frames, not queue rows. The robot zeroes its commanded
// speed after 400 ms without a fresh frame (FUNC_COMMANDS §2.3), so a held button
// repeats well inside that window.
// FUNC_COMMANDS §2.1 marks the 3007/3008 directions as inferred; the live check from
// this pad showed they are the other way round, so the glyphs keep their meaning and
// the two codes are swapped here (↪️ turns right, ↩️ turns left).
const RC_CODES = { "rc-forward": 3005, "rc-back": 3006, "rc-right": 3007, "rc-left": 3008 };
const RC_HOLD_MS = 250;
let rcHolding = null;
let rcSendTimer = null;
let rcActiveUntil = 0; // status polls speed up while control frames are recent

// Zones (doc/PLAN.md §20.5). Picker mode selects stored regions to clean; edit mode
// draws and adjusts rectangles. Edits are blocked while a clean runs (server-enforced,
// and the pencil is disabled here too).
const TYPE_FIELDS = {
  noGo: { active: "forbid", forbidType: "all" },
  noSweep: { active: "forbid", forbidType: "sweep" },
  noMop: { active: "forbid", forbidType: "mop" },
  clean: { active: "normal" },
  deep: { active: "depth" },
};
const TYPE_COLOURS = {
  noGo: "rgba(220,60,60,0.35)",
  noSweep: "rgba(230,160,30,0.35)",
  noMop: "rgba(60,120,230,0.35)",
  clean: "rgba(60,180,90,0.35)",
  deep: "rgba(150,80,220,0.35)",
};
let zonesView = false;
let zonesEdit = false;
let zoneState = { version: 0, zones: [], cleaning: false };
let zoneBaseline = null;   // the loaded list, for cancel
let zoneSelected = new Set();
let zoneEditIndex = -1;
let zoneUndo = [];
let zoneDraft = null;      // rectangle being dragged out: {from:[mm,mm], to:[mm,mm]}
let zoneDrag = null;       // moving a zone or one of its vertices
let zonePending = null;    // which zone the pointer went down on (picker tap)

async function json(url, options) {
  const response = await fetch(url, options);
  if (!response.ok) {
    let detail = String(response.status);
    try {
      detail = (await response.json()).error || detail;
    } catch (ignored) {
      // not a JSON error body; keep the status
    }
    throw new Error(detail);
  }
  return response.json();
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

function api(suffix, options) {
  return json("/api/robot/" + encodeURIComponent(robot) + suffix, options);
}

async function init() {
  const robots = await json("/api/robots");
  robotEntries = robots.robots;
  robotSelect.innerHTML = "";
  for (const entry of robots.robots) {
    const option = document.createElement("option");
    option.value = entry.id;
    option.textContent = entry.label || entry.id;
    robotSelect.append(option);
  }
  const wanted = new URLSearchParams(location.search).get("id");
  if (wanted) {
    const match = robots.robots.find(
      (entry) => entry.id === wanted || entry.label === wanted || entry.sn === wanted,
    );
    if (match) robotSelect.value = match.id;
  }
  robotSelect.onchange = () => {
    location.search = "?id=" + encodeURIComponent(robotSelect.value);
  };

  const catalog = await json("/api/commands");
  commandSelect.innerHTML = "";
  for (const name of catalog.commands) {
    const option = document.createElement("option");
    option.value = option.textContent = name;
    commandSelect.append(option);
  }
  document.getElementById("send").onclick = send;
  document.getElementById("remote-open").onclick = openRemote;
  document.getElementById("remote-close").onclick = closeRemote;
  for (const button of document.querySelectorAll("#remote .pad button")) {
    button.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      button.setPointerCapture(event.pointerId);
      holdStart(button);
    });
    const release = () => holdStop(true);
    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("contextmenu", (event) => event.preventDefault());
  }
  chargeButton.onclick = () => sendCommand("findCharge");
  primaryButton.onclick = () => {
    if (primaryButton.dataset.command) sendCommand(primaryButton.dataset.command);
  };
  menuToggle.onclick = () => {
    const open = menu.classList.toggle("open");
    menuToggle.textContent = open ? "⦀" : "☰";
    if (open) menu.style.top = header.offsetHeight + "px";
  };
  document.getElementById("zones").onclick = openZones;
  document.getElementById("settings-open").onclick = openSettings;
  document.getElementById("settings-cancel").onclick = closeSettings;
  document.getElementById("settings-save").onclick = saveSettings;
  document.getElementById("zone-exit").onclick = closeZones;
  document.getElementById("zone-edit").onclick = startEdit;
  document.getElementById("edit-cancel").onclick = cancelEdit;
  document.getElementById("edit-undo").onclick = undoZones;
  document.getElementById("edit-delete").onclick = deleteSelectedZone;
  document.getElementById("edit-save").onclick = saveZones;
  document.getElementById("zone-play").onclick = cleanSelectedZones;
  document.getElementById("zone-type").onchange = retypeSelectedZone;

  if (!robotSelect.value) {
    statusLine.textContent = "no robots seen yet";
    return;
  }
  robot = robotSelect.value;
  resize();
  tickLoop();
}

// Poll faster while steering, and fall back to the normal cadence 300 ms after the
// last control frame.
async function tickLoop() {
  await tick();
  setTimeout(tickLoop, Date.now() < rcActiveUntil ? 300 : 1500);
}

async function tick() {
  // Hiding the tab pauses the heartbeat, and with it the path poller.
  if (!robot || document.hidden) return;
  try {
    const summary = await api("/summary");
    statusLine.textContent = describe(summary);
    updateButtons(summary);
    if (zonesView) {
      // Keep the guard and the list fresh, but never clobber local edits in progress.
      const data = await json(zonesUrl());
      if (!zonesEdit) {
        zoneState = data;
      } else {
        zoneState.cleaning = data.cleaning;
      }
      updateBars();
      draw();
    }
    const map = summary.map;
    if (map && map.map_id != null) {
      const rev = map.map_id + ":" + map.received_ms;
      if (rev !== mapRev) {
        base = await api("/map");
        mapRev = rev;
        setMap(base);
      }
    }
    const path = summary.path;
    const rev = path ? path.path_id + ":" + path.span : "none";
    if (rev !== pathRev) {
      points = path ? (await api("/path")).points : [];
      pathRev = rev;
      draw();
    }
  } catch (error) {
    statusLine.textContent = "error: " + error.message;
  }
}

function describe(summary) {
  const bits = [summary.online ? "online" : "offline"];
  const status = summary.status || {};
  if (status.mode) bits.push(status.mode);
  if (status.elec != null) bits.push("battery " + status.elec + "%");
  if (status.cleanTime != null) bits.push("clean " + status.cleanTime + "s");
  if (status.cleanArea != null) bits.push("area " + status.cleanArea + "m²");
  bits.push(summary.sn);
  return bits.join("  ·  ");
}

async function send() {
  await sendCommand(commandSelect.value);
}

async function sendCommand(name) {
  try {
    const body = new URLSearchParams({ name });
    const reply = await api("/command", { method: "POST", body });
    const note = "queued #" + reply.queued + " " + reply.name;
    sentLine.textContent = note;
    statusLine.textContent = note; // the next poll overwrites it
  } catch (error) {
    sentLine.textContent = "send failed: " + error.message;
  }
}

function openRemote() {
  remoteSheet.classList.add("open");
  tick(); // fresh status as the pad opens
}

// Settings: a full-screen form over everything. Only the label is editable for now.
function openSettings() {
  menu.classList.remove("open");
  menuToggle.textContent = "☰";
  const entry = robotEntries.find((candidate) => candidate.id === robot);
  settingsLabel.value = (entry && entry.label) || (entry && entry.sn) || "";
  settingsPane.hidden = false;
  settingsLabel.focus();
  settingsLabel.select();
}

function closeSettings() {
  settingsPane.hidden = true;
}

async function saveSettings() {
  const label = settingsLabel.value.trim();
  if (!label) {
    statusLine.textContent = "the label cannot be empty";
    return;
  }
  try {
    const reply = await json("/api/robot/" + encodeURIComponent(robot) + "/settings", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ label }),
    });
    const entry = robotEntries.find((candidate) => candidate.id === robot);
    if (entry) entry.label = reply.label;
    const option = [...robotSelect.options].find((candidate) => candidate.value === robot);
    if (option) option.textContent = reply.label;
    statusLine.textContent = "label saved: " + reply.label;
    closeSettings();
  } catch (error) {
    statusLine.textContent = "label not saved: " + error.message;
  }
}

function closeRemote() {
  holdStop(true);      // zero speed first, if a button was held
  remoteSheet.classList.remove("open");
  sendControl(4000);   // leave manual mode; a no-op when it was never entered
}

function sendControl(code) {
  rcActiveUntil = Date.now() + 300;
  return fetch("/api/robot/" + encodeURIComponent(robot) + "/control", {
    method: "POST",
    body: new URLSearchParams({ code: String(code) }),
  })
    .then((response) => {
      if (!response.ok) throw new Error(response.status);
    })
    .catch((error) => {
      statusLine.textContent = "control: " + error.message;
    });
}

function holdStart(button) {
  if (!robot || rcHolding) return;
  rcHolding = button;
  const code = RC_CODES[button.id];
  const hold = () => {
    if (rcHolding !== button) return;
    sendControl(code);
    rcSendTimer = setTimeout(hold, RC_HOLD_MS);
  };
  hold();
}

// Release: stop repeating and zero the speed, staying in manual mode until the
// sheet is closed (which sends 4000).
function holdStop(sendZero) {
  if (rcSendTimer) {
    clearTimeout(rcSendTimer);
    rcSendTimer = null;
  }
  const wasHolding = rcHolding !== null;
  rcHolding = null;
  if (sendZero && wasHolding) sendControl(4001);
}

// ── Zones ────────────────────────────────────────────────────────────────────────

function zonesUrl(suffix = "") {
  return "/api/robot/" + encodeURIComponent(robot) + "/zones" + suffix;
}

async function openZones() {
  zonesView = true;
  zonesEdit = false;
  zoneSelected.clear();
  zoneEditIndex = -1;
  updateBars();
  await loadZones(true);
}

function closeZones() {
  zonesView = false;
  zonesEdit = false;
  zoneSelected.clear();
  zoneEditIndex = -1;
  zoneDraft = null;
  updateBars();
  draw();
}

/// Fetch the cached list, and with `refresh` also ask the robot for a fresh one
/// (21004) and wait for the reply to land in the cache.
async function loadZones(refresh) {
  try {
    zoneState = await json(zonesUrl());
    draw();
    updateBars();
    if (!refresh) return;
    const seen = zoneState.read_ms || 0;
    await fetch(zonesUrl("/refresh"), { method: "POST" });
    for (let attempt = 0; attempt < 8; attempt++) {
      await sleep(750);
      const data = await json(zonesUrl());
      if ((data.read_ms || 0) > seen || attempt === 7) {
        zoneState = data;
        draw();
        updateBars();
        return;
      }
    }
  } catch (error) {
    statusLine.textContent = "zones: " + error.message;
  }
}

function updateBars() {
  document.getElementById("bar-main").hidden = zonesView;
  document.getElementById("bar-zones").hidden = !zonesView || zonesEdit;
  document.getElementById("bar-edit").hidden = !zonesEdit;
  document.getElementById("zone-types").hidden = !zonesEdit;
  const play = document.getElementById("zone-play");
  play.disabled = zoneState.cleaning || zoneSelected.size === 0;
  play.title = zoneState.cleaning
    ? "A clean is running"
    : "Clean " + zoneSelected.size + " selected zone(s)";
  const edit = document.getElementById("zone-edit");
  edit.disabled = zoneState.cleaning;
  edit.title = zoneState.cleaning ? "A clean is running; editing is blocked" : "Edit zones";
  document.getElementById("edit-delete").disabled = zoneEditIndex < 0;
  document.getElementById("edit-undo").disabled = zoneUndo.length === 0;
}

function snapshotZones() {
  zoneUndo.push(JSON.stringify(zoneState.zones));
  if (zoneUndo.length > 20) zoneUndo.shift();
}

function startEdit() {
  zonesEdit = true;
  zoneSelected.clear();
  zoneEditIndex = -1;
  zoneUndo = [];
  zoneBaseline = JSON.stringify(zoneState.zones);
  updateBars();
  draw();
}

function cancelEdit() {
  if (zoneBaseline !== null) zoneState.zones = JSON.parse(zoneBaseline);
  zonesEdit = false;
  zoneEditIndex = -1;
  zoneDraft = null;
  updateBars();
  draw();
}

function undoZones() {
  const previous = zoneUndo.pop();
  if (previous === undefined) return;
  zoneState.zones = JSON.parse(previous);
  zoneEditIndex = -1;
  updateBars();
  draw();
}

function deleteSelectedZone() {
  if (zoneEditIndex < 0) return;
  snapshotZones();
  zoneState.zones.splice(zoneEditIndex, 1);
  zoneEditIndex = -1;
  updateBars();
  draw();
}

function retypeSelectedZone() {
  if (zoneEditIndex < 0) return;
  snapshotZones();
  Object.assign(zoneState.zones[zoneEditIndex], TYPE_FIELDS[document.getElementById("zone-type").value]);
  draw();
}

async function saveZones() {
  try {
    const reply = await json(zonesUrl(), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ version: zoneState.version, value: zoneState.zones }),
    });
    statusLine.textContent = "zones saved; confirming with the robot…";
    zonesEdit = false;
    zoneState.version = reply.version;
    updateBars();
    await loadZones(true);
    statusLine.textContent = "zones saved";
  } catch (error) {
    statusLine.textContent = "zone save refused: " + error.message;
  }
}

/// The server queues the whole correct sequence: `21023` with the picked stored region
/// ids (plus `-3` so stored no-go zones stay active), then `21005 {"mode":"appointClean"}`
/// — the "start from the current region set" path (ZONE_CLEAN.md, 2026-10-09). A
/// `smartClean` here would wipe the selection with a whole-map total region.
async function cleanSelectedZones() {
  const ids = [...zoneSelected].map((index) => zoneState.zones[index]).filter(Boolean)
    .map((zone) => Number(zone.id)).filter((id) => Number.isFinite(id));
  if (!ids.length) return;
  try {
    await json(zonesUrl("/clean"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids }),
    });
    statusLine.textContent = "zone clean started (" + ids.join(", ") + ")";
    closeZones();
  } catch (error) {
    statusLine.textContent = "zone clean refused: " + error.message;
  }
}

function zoneType(zone) {
  if (zone.active === "depth") return "deep";
  if (zone.active === "forbid") {
    if (zone.forbidType === "sweep") return "noSweep";
    if (zone.forbidType === "mop") return "noMop";
    return "noGo";
  }
  return "clean";
}

/// Only normal/deep zones are clean *targets*; forbid zones are obstacles
/// (FUNC_MAP §6.1: `-4` means "stored non-forbid regions only").
function cleanableZone(zone) {
  const type = zoneType(zone);
  return type === "clean" || type === "deep";
}

function zonePoints(zone) {
  return (zone.vertexs || []).map(([x, y]) => toPixel(x / 1000, y / 1000));
}

/// Canvas pixel → millimetres in the robot's world frame (the inverse of toPixel).
function fromPixel(px, py) {
  const resolution = (base.resolution || 0.05) * 1000;
  const x0 = (base.x_min || 0) * 1000;
  const y0 = (base.y_min || 0) * 1000;
  const col = px - 0.5;
  const row = base.height - 1 - (py - 0.5);
  return [
    Math.round(col * resolution + x0 + resolution),
    Math.round(row * resolution + y0 + resolution),
  ];
}

function pointerMillimetres(event) {
  const rect = canvas.getBoundingClientRect();
  return fromPixel(event.clientX - rect.left, event.clientY - rect.top);
}

function pointInPolygon([x, y], vertices) {
  let inside = false;
  for (let i = 0, j = vertices.length - 1; i < vertices.length; j = i++) {
    const [xi, yi] = vertices[i];
    const [xj, yj] = vertices[j];
    if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function zoneAt(point) {
  for (let index = zoneState.zones.length - 1; index >= 0; index--) {
    if (pointInPolygon(point, zoneState.zones[index].vertexs || [])) return index;
  }
  return -1;
}

/// The zone vertex under the pointer, in canvas pixels (fat targets for fingers).
function vertexAt(event) {
  if (zoneEditIndex < 0) return -1;
  const rect = canvas.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;
  const vertices = zoneState.zones[zoneEditIndex].vertexs || [];
  for (let index = 0; index < vertices.length; index++) {
    const [px, py] = toPixel(vertices[index][0] / 1000, vertices[index][1] / 1000);
    if (Math.hypot(px - x, py - y) < 14) return index;
  }
  return -1;
}

/// Finish a dragged-out rectangle: round to whole millimetres, insist on the same
/// two-cell minimum the server enforces, and give it the picked type.
function commitZoneDraft() {
  const [x1, y1] = zoneDraft.from;
  const [x2, y2] = zoneDraft.to;
  zoneDraft = null;
  const minX = Math.round(Math.min(x1, x2));
  const maxX = Math.round(Math.max(x1, x2));
  const minY = Math.round(Math.min(y1, y2));
  const maxY = Math.round(Math.max(y1, y2));
  if (maxX - minX < 100 || maxY - minY < 100) {
    statusLine.textContent = "zone too small: needs two 50 mm cells each way";
    draw();
    return;
  }
  snapshotZones();
  const id = zoneState.zones.reduce((max, zone) => Math.max(max, Number(zone.id) || 0), 0) + 1;
  zoneState.zones.push({
    ...TYPE_FIELDS[document.getElementById("zone-type").value],
    vertexs: [[minX, minY], [maxX, minY], [maxX, maxY], [minX, maxY]],
    id,
    mode: "area",
    name: "",
    tag: "",
  });
  zoneEditIndex = zoneState.zones.length - 1;
  updateBars();
  draw();
}

// Bottom bar: the stateful button follows the robot's `mode` (FUNC_STATUS §3.1):
// docked and idle start a clean, `sweep` pauses the clean, `backcharge` pauses the
// return, and the paused states resume. Anything else (manual control, fault,
// offline, no status yet) is disabled with the raw mode as its tooltip.
const PRIMARY_STATES = {
  charge: ["▶️", "Smart cleaning", "smartClean"],
  fullcharge: ["▶️", "Smart cleaning", "smartClean"],
  idle: ["▶️", "Smart cleaning", "smartClean"],
  sweep: ["⏸️", "Pause", "pause"],
  backcharge: ["⏸️", "Pause", "pauseReturn"],
  pause: ["⏯️", "Continue", "continue"],
  dormant: ["⏯️", "Continue", "continue"],
  fault: ["⏯️", "Continue", "continue"],
};

function updateButtons(summary) {
  const mode = (summary.status || {}).mode || "";
  chargeButton.disabled = !(summary.online && mode);
  const state = PRIMARY_STATES[mode];
  if (!summary.online || !state) {
    primaryButton.disabled = true;
    primaryButton.textContent = "▶️";
    primaryButton.title = mode || "Unknown state";
    delete primaryButton.dataset.command;
    return;
  }
  primaryButton.disabled = false;
  primaryButton.textContent = state[0];
  primaryButton.title = state[1];
  primaryButton.dataset.command = state[2];
}

function draw() {
  if (!base || !grid || !view) return;
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(
    dpr * view.scale, 0, 0, dpr * view.scale, dpr * view.x, dpr * view.y,
  );
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(grid, 0, 0);

  if (points.length > 1) {
    ctx.strokeStyle = "rgb(30,90,220)";
    ctx.lineWidth = 1.5 / view.scale;
    ctx.lineJoin = "round";
    ctx.beginPath();
    points.forEach(([x, y], index) => {
      const [px, py] = toPixel(x / 1000, y / 1000);
      if (index) ctx.lineTo(px, py);
      else ctx.moveTo(px, py);
    });
    ctx.stroke();
  }
  dot(points[0], "rgb(40,200,60)");
  dot(points[points.length - 1], "rgb(250,140,20)");
  if (base.dock_x != null && base.dock_y != null) {
    diamond(toPixel(base.dock_x / 1000, base.dock_y / 1000));
  }
  drawZones();
}

function drawZones() {
  if (!zonesView) return;
  zoneState.zones.forEach((zone, index) => {
    const points = zonePoints(zone);
    if (points.length < 2) return;
    ctx.beginPath();
    points.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    if (points.length > 2) ctx.closePath();
    ctx.fillStyle = TYPE_COLOURS[zoneType(zone)];
    ctx.fill();
    const active = zonesEdit ? index === zoneEditIndex : zoneSelected.has(index);
    ctx.lineWidth = (active ? 3 : 2) / view.scale;
    ctx.strokeStyle = active ? "rgb(255,255,255)" : "rgba(255,255,255,0.55)";
    ctx.stroke();
    if (zonesEdit && index === zoneEditIndex) {
      const radius = 7 / view.scale;
      ctx.fillStyle = "rgb(255,255,255)";
      points.forEach(([x, y]) => ctx.fillRect(x - radius / 2, y - radius / 2, radius, radius));
    }
  });
  if (zoneDraft) {
    const [x1, y1] = toPixel(zoneDraft.from[0] / 1000, zoneDraft.from[1] / 1000);
    const [x2, y2] = toPixel(zoneDraft.to[0] / 1000, zoneDraft.to[1] / 1000);
    ctx.setLineDash([6 / view.scale, 4 / view.scale]);
    ctx.lineWidth = 2 / view.scale;
    ctx.strokeStyle = "rgb(255,255,255)";
    ctx.strokeRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
    ctx.setLineDash([]);
  }
}

// The same frame mapping tools/map2png.py validated: cell centres sit half a
// cell inside the wire origin, and the rows are flipped for +y up.
function toPixel(x, y) {
  const resolution = base.resolution || 0.05;
  const col = (x - (base.x_min || 0) - 0.05) / resolution;
  let row = (y - (base.y_min || 0) - 0.05) / resolution;
  row = base.height - 1 - row;
  return [col + 0.5, row + 0.5];
}

function dot(point, colour) {
  if (!point) return;
  const [x, y] = point;
  ctx.fillStyle = colour;
  ctx.beginPath();
  ctx.arc(x, y, 3 / view.scale, 0, 7);
  ctx.fill();
}

function diamond([x, y]) {
  const radius = 4 / view.scale;
  ctx.fillStyle = "rgb(230,40,40)";
  ctx.beginPath();
  ctx.moveTo(x, y - radius);
  ctx.lineTo(x + radius, y);
  ctx.lineTo(x, y + radius);
  ctx.lineTo(x - radius, y);
  ctx.fill();
}

function cellColour(cell) {
  if (cell === 0x00) return [28, 28, 36];
  if (cell === 0x7f) return [158, 162, 172];
  if (cell === 0xff) return [250, 250, 246];
  return hsv((cell * 0.61803398875) % 1, 0.42, 0.96);
}

function hsv(h, s, v) {
  const i = Math.floor(h * 6);
  const f = h * 6 - i;
  const p = v * (1 - s);
  const q = v * (1 - f * s);
  const t = v * (1 - (1 - f) * s);
  const [r, g, b] = [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
  return [(r * 255) | 0, (g * 255) | 0, (b * 255) | 0];
}

function base64Bytes(text) {
  const binary = atob(text);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

// Render the wire grid into an offscreen canvas once, at one pixel per cell.
function setMap(map) {
  const width = map.width;
  const height = map.height;
  const cells = base64Bytes(map.grid_b64);
  grid = document.createElement("canvas");
  grid.width = width;
  grid.height = height;
  const target = grid.getContext("2d");
  const image = target.createImageData(width, height);
  for (let row = 0; row < height; row++) {
    // Wire row 0 is the smallest y; the page reads like a floor plan (+y up).
    const src = (height - 1 - row) * width;
    const dst = row * width * 4;
    for (let col = 0; col < width; col++) {
      const [r, g, b] = cellColour(cells[src + col]);
      const at = dst + col * 4;
      image.data[at] = r;
      image.data[at + 1] = g;
      image.data[at + 2] = b;
      image.data[at + 3] = 255;
    }
  }
  target.putImageData(image, 0, 0);
  if (autoFit || !view) fit();
  else draw();
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (!width || !height) return;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  if (!grid) return;
  if (autoFit) fit();
  else draw();
}

// The largest map that fits the client area whole, aspect ratio intact.
function fitScale() {
  return Math.min(canvas.clientWidth / grid.width, canvas.clientHeight / grid.height);
}

function fit() {
  const scale = fitScale();
  view = {
    scale,
    x: (canvas.clientWidth - grid.width * scale) / 2,
    y: (canvas.clientHeight - grid.height * scale) / 2,
  };
  autoFit = true;
  draw();
}

// Zoom about a point in canvas coordinates, so the map stays put under the cursor.
function zoomAt(x, y, factor) {
  if (!view) return;
  const min = fitScale();
  const next = Math.min(Math.max(view.scale * factor, min), min * 20);
  // Zoomed all the way out: snap back to the fitted, centred view, so the
  // minimum zoom can never leave the map off in a corner of empty space.
  if (next <= min) {
    fit();
    return;
  }
  view.x = x - (x - view.x) * (next / view.scale);
  view.y = y - (y - view.y) * (next / view.scale);
  view.scale = next;
  autoFit = false;
  draw();
}

function pointerPair() {
  return [...pointers.values()].slice(0, 2);
}

function startPinch() {
  const [a, b] = pointerPair();
  const rect = canvas.getBoundingClientRect();
  pinch = {
    distance: Math.hypot(a.x - b.x, a.y - b.y),
    mx: (a.x + b.x) / 2 - rect.left,
    my: (a.y + b.y) / 2 - rect.top,
  };
}

/// Incremental pinch: pan by however far the midpoint moved, then zoom about the new
/// midpoint. Two fingers therefore both zoom and drag the map.
function pinchMove() {
  const [a, b] = pointerPair();
  if (!pinch || !pinch.distance) return;
  const rect = canvas.getBoundingClientRect();
  const distance = Math.hypot(a.x - b.x, a.y - b.y);
  const mx = (a.x + b.x) / 2 - rect.left;
  const my = (a.y + b.y) / 2 - rect.top;
  const min = fitScale();
  const next = Math.min(Math.max(view.scale * (distance / pinch.distance), min), min * 20);
  if (next <= min) {
    fit();
    pinch.distance = distance;
    pinch.mx = mx;
    pinch.my = my;
    return;
  }
  view.x += mx - pinch.mx;
  view.y += my - pinch.my;
  const ratio = next / view.scale;
  view.x = mx - (mx - view.x) * ratio;
  view.y = my - (my - view.y) * ratio;
  view.scale = next;
  pinch.distance = distance;
  pinch.mx = mx;
  pinch.my = my;
  autoFit = false;
  draw();
}

canvas.addEventListener("pointerdown", (event) => {
  if (event.pointerType === "mouse" && event.button !== 0 && event.button !== 2) return;
  canvas.setPointerCapture(event.pointerId);
  // In the zone editor a left drag draws or moves; right drag and (elsewhere) left
  // drag pan. Two fingers always pinch/pan.
  const pan = event.button === 2 || !(zonesView && zonesEdit);
  pointers.set(event.pointerId, { x: event.clientX, y: event.clientY, moved: 0, pan });
  canvas.classList.add("panning");
  if (pointers.size === 2) {
    startPinch();
  } else if (pointers.size === 1 && !pan) {
    const point = pointerMillimetres(event);
    const vertex = vertexAt(event);
    if (vertex >= 0) {
      zoneDrag = { kind: "vertex", vertex, snapshot: false };
    } else {
      const hit = zoneAt(point);
      if (hit >= 0) {
        zoneEditIndex = hit;
        document.getElementById("zone-type").value = zoneType(zoneState.zones[hit]);
        zoneDrag = { kind: "move", index: hit, from: point, original: JSON.parse(JSON.stringify(zoneState.zones[hit].vertexs)), snapshot: false };
      } else {
        zoneDraft = { from: point, to: point };
      }
      updateBars();
    }
  } else if (pointers.size === 1 && zonesView && !zonesEdit) {
    // Picker mode: a drag pans, but a tap (no movement) toggles the zone under it.
    const hit = zoneAt(pointerMillimetres(event));
    zonePending = hit >= 0 ? hit : null;
    if (hit >= 0) updateBars();
  }
});

canvas.addEventListener("pointermove", (event) => {
  const point = pointers.get(event.pointerId);
  if (!point || !view) return;
  if (zoneDrag) {
    const [x, y] = pointerMillimetres(event);
    if (!zoneDrag.snapshot) {
      snapshotZones();
      zoneDrag.snapshot = true;
    }
    if (zoneDrag.kind === "vertex") {
      zoneState.zones[zoneEditIndex].vertexs[zoneDrag.vertex] = [x, y];
    } else {
      const dx = x - zoneDrag.from[0];
      const dy = y - zoneDrag.from[1];
      zoneState.zones[zoneDrag.index].vertexs =
        zoneDrag.original.map(([vx, vy]) => [vx + dx, vy + dy]);
    }
    draw();
    return;
  }
  if (zoneDraft) {
    zoneDraft.to = pointerMillimetres(event);
    draw();
    return;
  }
  if (!point.pan) return;
  if (pointers.size === 1) {
    point.moved += Math.abs(event.clientX - point.x) + Math.abs(event.clientY - point.y);
    view.x += event.clientX - point.x;
    view.y += event.clientY - point.y;
    point.x = event.clientX;
    point.y = event.clientY;
    autoFit = false;
    draw();
  } else {
    point.x = event.clientX;
    point.y = event.clientY;
    if (pointers.size === 2) pinchMove();
  }
});

function endPointer(event) {
  const point = pointers.get(event.pointerId);
  pointers.delete(event.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) canvas.classList.remove("panning");
  if (zoneDrag) {
    zoneDrag = null;
    return;
  }
  if (zoneDraft) {
    commitZoneDraft();
    return;
  }
  if (zonePending !== null && point && point.moved < 6) {
    const zone = zoneState.zones[zonePending];
    if (!cleanableZone(zone)) {
      statusLine.textContent = zoneType(zone) + " zones are obstacles, not clean targets";
    } else if (zoneSelected.has(zonePending)) {
      zoneSelected.delete(zonePending);
    } else {
      zoneSelected.add(zonePending);
    }
    updateBars();
    draw();
  }
  zonePending = null;
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);

canvas.addEventListener(
  "wheel",
  (event) => {
    event.preventDefault();
    const rect = canvas.getBoundingClientRect();
    zoomAt(
      event.clientX - rect.left,
      event.clientY - rect.top,
      Math.exp(-event.deltaY * 0.002),
    );
  },
  { passive: false },
);

// Double-click / double-tap: back to the fitted view.
canvas.addEventListener("dblclick", () => { if (grid) fit(); });
window.addEventListener("resize", () => {
  if (menu.classList.contains("open")) menu.style.top = header.offsetHeight + "px";
  resize();
});

init().catch((error) => { statusLine.textContent = "error: " + error.message; });
</script>
</body>
</html>
